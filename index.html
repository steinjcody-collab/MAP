<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cody Stein — Listings Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    --ink:#1F2E29;
    --sand:#F4EFE4;
    --card:#FFFDF8;
    --hairline:#E4DCCB;
    --clay:#A64B2A;
    --sage:#4F6B47;
    --sage-soft:#E7EDE3;
    --muted:#6F695C;
    --shadow:0 1px 2px rgba(31,46,41,.08), 0 6px 18px rgba(31,46,41,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--sand);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:16px 22px;background:var(--card);border-bottom:1px solid var(--hairline);
  }
  .brand .name{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:-.01em;line-height:1.1;}
  .brand .tag{font-size:12px;color:var(--muted);margin-top:3px;}
  .filters{display:flex;gap:6px;background:var(--sand);padding:4px;border-radius:999px;}
  .filters button{
    font:600 13px 'Inter',sans-serif;padding:7px 14px;border-radius:999px;border:0;
    background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;
  }
  .filters button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}

  .layout{display:flex;height:calc(100% - 71px);}
  .sidebar{width:380px;min-width:380px;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--hairline);}
  .count{padding:12px 18px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--hairline);}
  .count b{color:var(--ink);}
  #list{flex:1;overflow-y:auto;padding:10px;}

  .card{
    display:flex;gap:12px;padding:10px;border-radius:12px;cursor:pointer;
    border:1px solid transparent;transition:background .12s,border-color .12s,box-shadow .12s;
  }
  .card + .card{margin-top:6px;}
  .card:hover,.card.hl{background:var(--sand);border-color:var(--hairline);}
  .card.active{background:var(--card);border-color:var(--ink);box-shadow:var(--shadow);}
  .thumb{
    width:112px;height:84px;border-radius:9px;flex-shrink:0;position:relative;overflow:hidden;
    background:var(--hairline);
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#B5AA93;}
  .ph svg{width:30px;height:30px;}
  .badge{
    position:absolute;top:6px;left:6px;background:var(--clay);color:#fff;
    font:700 9.5px 'Inter',sans-serif;letter-spacing:.04em;text-transform:uppercase;
    padding:3px 6px;border-radius:5px;max-width:96px;line-height:1.2;
  }
  .info{min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .price{font-family:'Fraunces',serif;font-weight:600;font-size:19px;line-height:1.1;}
  .price small{font:500 12px 'Inter',sans-serif;color:var(--muted);}
  .addr{font-size:13px;color:var(--ink);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stats{font-size:12px;color:var(--muted);margin-top:3px;}
  .row{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap;}
  .tag{font:600 10.5px 'Inter',sans-serif;letter-spacing:.03em;padding:2px 8px;border-radius:999px;}
  .tag.rent{background:var(--sage-soft);color:var(--sage);}
  .tag.sale{background:rgba(166,75,42,.12);color:var(--clay);}
  .link{font:600 12px 'Inter',sans-serif;color:var(--ink);text-decoration:none;border-bottom:1px solid currentColor;}
  .link:hover{color:var(--clay);}
  .pending{font-size:11px;color:var(--muted);}
  .empty{padding:30px 18px;color:var(--muted);font-size:14px;text-align:center;}

  #map{flex:1;position:relative;}
  .map-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;padding:20px;text-align:center;}

  /* price-tag markers */
  .pin{
    font:700 12.5px 'Inter',sans-serif;color:var(--ink);background:var(--card);
    padding:5px 10px;border-radius:999px;border:1.5px solid var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,.18);white-space:nowrap;cursor:pointer;
    transition:transform .12s,background .12s,color .12s;position:relative;
  }
  .pin::after{
    content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    border:6px solid transparent;border-bottom:0;border-top-color:var(--ink);
  }
  .pin.sale{border-color:var(--clay);color:var(--clay);}
  .pin.sale::after{border-top-color:var(--clay);}
  .pin.hl,.pin.active{background:var(--ink);color:#fff;transform:scale(1.12);}
  .pin.sale.hl,.pin.sale.active{background:var(--clay);color:#fff;}
  .maplibregl-marker:has(.pin.hl),.maplibregl-marker:has(.pin.active){z-index:5;}

  .maplibregl-popup-content{padding:0;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:var(--card);}
  .maplibregl-popup-close-button{font-size:20px;width:30px;height:30px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);right:2px;top:2px;}
  .pop{width:260px;font-family:'Inter',sans-serif;}
  .pop .thumb{width:100%;height:150px;border-radius:0;}
  .pop .body{padding:12px 14px 14px;}
  .pop .addr{white-space:normal;}

  footer{
    position:fixed;right:10px;bottom:8px;z-index:3;font-size:11px;color:var(--muted);
    background:rgba(255,253,248,.9);padding:3px 8px;border-radius:6px;
  }

  @media (max-width:760px){
    header{padding:12px 14px;}
    .layout{flex-direction:column;height:auto;}
    #map{height:46vh;min-height:300px;flex:none;}
    .sidebar{width:100%;min-width:0;border-right:0;border-top:1px solid var(--hairline);}
    #list{overflow:visible;}
    .thumb{width:100px;height:76px;}
    footer{position:static;text-align:center;background:none;padding:10px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="name">Cody Stein</div>
    <div class="tag">Current listings</div>
  </div>
  <div class="filters">
    <button data-type="all" class="active">All</button>
    <button data-type="sale">For Sale</button>
    <button data-type="rent">For Rent</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="count" id="count">Loading listings…</div>
    <div id="list"></div>
  </aside>
  <div id="map"></div>
</div>
<footer id="updated"></footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOUSE = '<div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></div>';

// A photo cell sometimes holds a listing PAGE link (e.g. zillow.com/homedetails/...)
// instead of an image link. Browsers can't display that, so treat it as "no photo"
// and show the placeholder instead of a broken/blank box.
function isImage(u){
  if(!u) return false;
  if(/zillow\.com\/homedetails|homes\.com\/property/i.test(u)) return false;
  return /\.(jpe?g|png|webp|gif|avif)(\?|#|$)/i.test(u) || /zillowstatic|images\.homes\.com|sparkplatform|googleusercontent|wsimg/i.test(u);
}
function photoHtml(l){
  if(!isImage(l.photo)) return HOUSE;
  return `<img src="${esc(l.photo)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{innerHTML:HOUSE_HTML}).firstChild)">`;
}
window.HOUSE_HTML = HOUSE;

const money = n => '$' + Number(n).toLocaleString();
function priceHtml(l){ return money(l.price) + (l.type === 'rent' ? ' <small>/mo</small>' : ''); }
function shortPrice(l){
  const p = Number(l.price);
  if(l.type === 'rent') return '$' + p.toLocaleString();
  return p >= 1e6 ? '$' + (p/1e6).toFixed(p % 1e6 ? 2 : 0).replace(/\.?0+$/,'') + 'M' : '$' + Math.round(p/1000) + 'K';
}
function statsHtml(l){
  const parts = [];
  if(+l.beds) parts.push(`${l.beds} bd`);
  if(+l.baths) parts.push(`${l.baths} ba`);
  if(+l.sqft) parts.push(`${Number(l.sqft).toLocaleString()} sqft`);
  return parts.join(' · ');
}

// ---------- state ----------
let ALL = [], filter = 'all', activeIdx = null;
const markers = new Map();   // idx -> {marker, el}
const cards = new Map();     // idx -> card element
let popup = null;

const params = new URLSearchParams(location.search);
const locked = params.get('filter');
if(locked === 'rent' || locked === 'sale'){
  filter = locked;
  document.querySelector('.filters').style.display = 'none';
  document.querySelector('.brand .tag').textContent = locked === 'rent' ? 'Current rentals' : 'Current listings for sale';
}

// ---------- map ----------
let map = null;
function showMapFallback(msg){
  document.getElementById('map').innerHTML = `<div class="map-fallback">${msg}</div>`;
  map = null;
}
try{
  if(typeof maplibregl === 'undefined') throw new Error('MapLibre did not load');
  if(maplibregl.supported && !maplibregl.supported()) throw new Error('WebGL not supported');
  map = new maplibregl.Map({
    container: 'map',
    // OpenFreeMap: free, no API key, no usage limits.
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [-112.0, 33.5], zoom: 8.5,
    dragRotate: false, pitchWithRotate: false, touchPitch: false,
    attributionControl: { compact: true }
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.on('error', e => console.warn('Map error:', e && e.error));
}catch(e){
  console.warn(e);
  showMapFallback('The map couldn\'t load on this device, but every listing is in the list.');
}
const onResize = () => map && map.resize();
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

function setHighlight(idx, on){
  const m = markers.get(idx), c = cards.get(idx);
  if(m) m.el.classList.toggle('hl', on);
  if(c) c.classList.toggle('hl', on);
}
function setActive(idx, {fly=false, scroll=false} = {}){
  if(activeIdx !== null){
    markers.get(activeIdx)?.el.classList.remove('active');
    cards.get(activeIdx)?.classList.remove('active');
  }
  activeIdx = idx;
  if(idx === null){ if(popup){ popup.remove(); popup = null; } return; }
  const l = ALL[idx], m = markers.get(idx), c = cards.get(idx);
  m?.el.classList.add('active'); c?.classList.add('active');
  if(scroll && c) c.scrollIntoView({ behavior:'smooth', block:'nearest' });
  if(map && m){
    if(fly) map.flyTo({ center:[l.lng, l.lat], zoom: Math.max(map.getZoom(), 13), speed: 1.4 });
    if(popup) popup.remove();
    popup = new maplibregl.Popup({ offset: 22, maxWidth: '280px', closeOnClick: true })
      .setLngLat([l.lng, l.lat]).setHTML(popupHtml(l)).addTo(map);
    popup.on('close', () => { if(activeIdx === idx){ m.el.classList.remove('active'); c?.classList.remove('active'); activeIdx = null; } });
  }
}

function popupHtml(l){
  return `<div class="pop">
    <div class="thumb">${photoHtml(l)}${l.deal ? `<div class="badge">${esc(l.deal)}</div>` : ''}</div>
    <div class="body">
      <div class="price">${priceHtml(l)}</div>
      <div class="addr">${esc(l.address)}</div>
      <div class="stats">${statsHtml(l)}</div>
      <div class="row"><span class="tag ${l.type}">${l.type === 'sale' ? 'For sale' : 'For rent'}</span>
      ${l.url ? `<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">View listing ↗</a>` : ''}</div>
    </div></div>`;
}

// ---------- render ----------
function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  markers.forEach(m => m.marker.remove()); markers.clear(); cards.clear();
  setActive(null);

  const shown = ALL.map((l, i) => [l, i]).filter(([l]) => filter === 'all' || l.type === filter);
  const n = shown.length, one = n === 1;
  const label = filter === 'rent' ? (one ? 'rental' : 'rentals')
              : filter === 'sale' ? (one ? 'home for sale' : 'homes for sale')
              : (one ? 'listing' : 'listings');
  document.getElementById('count').innerHTML = n ? `<b>${n}</b> ${label}` : '';
  if(!shown.length){ list.innerHTML = '<div class="empty">No listings right now — check back soon.</div>'; return; }

  const bounds = map ? new maplibregl.LngLatBounds() : null;
  shown.forEach(([l, i]) => {
    const hasCoords = l.lat != null && l.lng != null;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb">${photoHtml(l)}${l.deal ? `<div class="badge">${esc(l.deal)}</div>` : ''}</div>
      <div class="info">
        <div class="price">${priceHtml(l)}</div>
        <div class="addr">${esc(l.address)}</div>
        <div class="stats">${statsHtml(l)}</div>
        <div class="row">
          <span class="tag ${l.type}">${l.type === 'sale' ? 'For sale' : 'For rent'}</span>
          ${l.url ? `<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">View listing ↗</a>` : ''}
          ${hasCoords ? '' : '<span class="pending">Map location pending</span>'}
        </div>
      </div>`;
    card.querySelector('.link')?.addEventListener('click', e => e.stopPropagation());
    card.addEventListener('mouseenter', () => setHighlight(i, true));
    card.addEventListener('mouseleave', () => setHighlight(i, false));
    if(hasCoords) card.addEventListener('click', () => setActive(i, { fly: true }));
    list.appendChild(card);
    cards.set(i, card);

    if(map && hasCoords){
      // MapLibre positions the outer element absolutely; the styled price tag
      // lives inside it so our CSS can't override that positioning.
      const wrap = document.createElement('div');
      const el = document.createElement('div');
      el.className = `pin ${l.type}`;
      el.textContent = shortPrice(l);
      wrap.appendChild(el);
      el.addEventListener('mouseenter', () => setHighlight(i, true));
      el.addEventListener('mouseleave', () => setHighlight(i, false));
      el.addEventListener('click', e => { e.stopPropagation(); setActive(i, { scroll: true }); });
      const marker = new maplibregl.Marker({ element: wrap, anchor: 'bottom', offset: [0, -6] })
        .setLngLat([l.lng, l.lat]).addTo(map);
      markers.set(i, { marker, el });
      bounds.extend([l.lng, l.lat]);
    }
  });

  if(map && !bounds.isEmpty()){
    const fit = () => map.fitBounds(bounds, { padding: { top: 60, bottom: 40, left: 50, right: 50 }, maxZoom: 13, duration: 0 });
    map.loaded() ? fit() : map.once('load', fit);
  }
}

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filter = btn.dataset.type;
  render();
}));

fetch('listings.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    // Skip half-filled rows in the sheet (e.g. a stray cell with no price or type)
    // so they don't drop a pin somewhere random.
    ALL = (data.listings || []).filter(l => l.address && +l.price > 0 && (l.type === 'rent' || l.type === 'sale'));
    if(data.updated){
      document.getElementById('updated').textContent = 'Updated ' +
        new Date(data.updated).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
    }
    render();
  })
  .catch(err => {
    console.error(err);
    document.getElementById('count').textContent = '';
    document.getElementById('list').innerHTML = '<div class="empty">Listings couldn\'t load. Please refresh.</div>';
  });
</script>
</body>
</html>
